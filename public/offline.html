<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hors ligne — Texas Grill</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; font-family: Arial, Helvetica, sans-serif; background:#15100c; color:#f7f1e4; text-align:center; padding:24px; }
  .flame { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#ef4c19,#b81f2b); display:grid; place-items:center; font-size:28px; }
  h1 { font-size:22px; margin:0; }
  p { margin:0; color:#c9beac; max-width:320px; font-size:14px; line-height:1.6; }
  button { border:0; border-radius:999px; padding:12px 22px; background:#ef4c19; color:white; font-weight:800; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
  <div class="flame">🔥</div>
  <h1>Vous êtes hors ligne</h1>
  <p>Impossible de charger Texas Grill pour le moment. Vérifiez votre connexion internet et réessayez.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
